<title>Integra Beauty Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

    --warn: #8a5a00;
    --warn-soft: #fbefd2;
    --info: #3a4f8f;
    --info-soft: #e1e7f7;
    --s1: #2a78d6;
    --s2: #eb6834;
    --grid: #ece6ee;
    --hover: rgba(107, 46, 95, 0.08);

      --muted: #a898ac;
      --line: #3a2c3e;
      --accent: #d9a2cc;
      --accent-fg: #2a1428;
      --accent-soft: #3d2840;
      --ok: #7fd1a3;
      --ok-soft: #1f3a2d;
      --bad: #f09a95;
      --bad-soft: #4a2326;
      --warn: #f0c970;
      --warn-soft: #3d3214;
      --info: #a9bbf0;
      --info-soft: #25305a;
      --s1: #3987e5;
      --s2: #d95926;
      --grid: #382b3b;
      --hover: rgba(217, 162, 204, 0.12);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a121c;
    --surface: #251a28;
    --row: #2e2132;
    --fg: #f0e7f2;
    --muted: #a898ac;
    --line: #3a2c3e;
    --accent: #d9a2cc;
    --accent-fg: #2a1428;
    --accent-soft: #3d2840;
    --ok: #7fd1a3;
    --ok-soft: #1f3a2d;
    --bad: #f09a95;
    --bad-soft: #4a2326;
    --warn: #f0c970;
    --warn-soft: #3d3214;
    --info: #a9bbf0;
    --info-soft: #25305a;
    --s1: #3987e5;
    --s2: #d95926;
    --grid: #382b3b;

  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 28px 56px; }
  .wrap { max-width: 980px; margin-inline: auto; display: flex; flex-direction: column; gap: 24px; }
  .panel { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
  .panel[hidden] { display: none; }
  h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(34px, 6vw, 52px); line-height: 1.05; letter-spacing: -0.01em; }
  h2 { font-size: 24px; }
  h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .eyebrow { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  header { display: flex; flex-direction: column; gap: 8px; }
  header p { margin: 0; color: var(--muted); max-width: 62ch; }

  .bar-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; border-bottom: 1px solid var(--line); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; }
  .tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 10px 14px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .tab:hover { color: var(--fg); }
  .tab:focus-visible { outline: 3px solid var(--fg); outline-offset: -3px; border-radius: 6px; }
  .tab .count { display: inline-block; min-width: 20px; text-align: center; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; }
  .scope { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 8px; }
  .scope[hidden] { display: none; }
  .scope button { appearance: none; border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--muted); padding: 5px 14px; border-radius: 7px; cursor: pointer; }
  .scope button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .scope button:focus-visible { outline: 3px solid var(--fg); outline-offset: 1px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .tile .k { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .tile .v { font-size: 26px; line-height: 1.15; font-weight: 600; overflow-wrap: anywhere; }
  .tile .v.small { font-size: 18px; }
  .tile .n { font-size: 12px; color: var(--muted); }

  section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 13px; }

  .timeline { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .tl-scroll { overflow-x: auto; }
  .tl-inner { min-width: 520px; position: relative; }
  .tl-axis { position: relative; height: 22px; border-bottom: 1px solid var(--line); }
  .tl-tick { position: absolute; top: 0; font-size: 11px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tl-tick.first { transform: none; }
  .tl-row { position: relative; height: 34px; border-bottom: 1px dashed var(--line); }
  .tl-row:last-child { border-bottom: 0; }
  .tl-bar { position: absolute; top: 7px; height: 20px; border-radius: 4px; background: var(--accent); min-width: 6px; color: var(--accent-fg); font-size: 11px; font-weight: 600; line-height: 20px; padding-inline: 8px; white-space: nowrap; overflow: hidden; }

  .tl-today { position: absolute; top: 22px; bottom: 0; width: 2px; background: var(--warn); }
  .tl-today span { position: absolute; top: -22px; right: 6px; font-size: 11px; color: var(--warn); font-weight: 600; }

  .report .name { font-weight: 600; font-size: 16px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .meta b { color: var(--fg); font-weight: 500; }
  .pill { display: inline-flex; align-items: center; width: fit-content; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--info-soft); color: var(--info); }
  .open { background: var(--accent); color: var(--accent-fg); text-decoration: none; font-weight: 600; padding: 10px 16px; border-radius: 8px; white-space: nowrap; }
  .open:hover { filter: brightness(1.08); }
  .open:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .url { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }

  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .chip.good { background: var(--ok-soft); color: var(--ok); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.info { background: var(--info-soft); color: var(--info); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.acc { background: var(--accent-soft); color: var(--accent); }

  .sub { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; margin-top: 6px; }
  .goals { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; }
  .goal { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .goal .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .goal .k { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .goal .v { font-size: 28px; line-height: 1.1; font-weight: 600; }
  .goal .vrow { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; }
  .goal .vrow .chip { margin: 0; }
  .goal ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .goal ul b { color: var(--fg); font-weight: 600; }
  .chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 14px; height: 2px; border-radius: 1px; vertical-align: middle; margin-right: 6px; }
  .legend i.dash { height: 0; background: none; border-top: 2px dashed var(--fg); border-radius: 0; opacity: .7; }
  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: var(--font-body); }
  .tip { position: absolute; top: 0; pointer-events: none; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5; box-shadow: 0 4px 14px rgba(0,0,0,.14); white-space: nowrap; z-index: 2; }
  .tip b { font-weight: 600; }
  .tip .row { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .tip .sw { width: 8px; height: 8px; border-radius: 50%; }
  .tbl-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--surface); }
  tr.total td { background: var(--row); font-weight: 600; }
  td .chip { margin-left: 6px; }
  .camp { font-size: 12px; font-weight: 600; color: var(--muted); }
  .share { display: inline-flex; align-items: center; gap: 8px; }
  .bar { display: inline-block; width: 56px; height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--s1); border-radius: 4px; }
  .tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }

  select:focus-visible, .sort:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .sort { appearance: none; background: none; border: 0; padding: 0; font: inherit; color: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }

  .how { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }

  .log-time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }

  .msg-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg-card textarea { width: 100%; box-sizing: border-box; min-height: 420px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.55; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; white-space: pre; overflow: auto; }
  .msg-card textarea:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .msg-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .btn { appearance: none; border: 0; background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 8px; cursor: pointer; }

</style>

</div>

    o.yTicks.forEach(t => {
      g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/>`;
      g += `<text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${o.yFmt(t)}</text>`;
    });
    if (yMin < 0) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1" opacity=".6"/>`;
    const step = Math.ceil(52 / band);
    rows.forEach((r, i) => {
      if (i % step === 0) g += `<text x="${cx(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtMD.format(parse(r.date))}</text>`;
    });
    if (o.kind === "bar") {
      const s = o.series[0], w = Math.min(24, Math.max(band - 2, 3)), y0 = y(0);
      let peak = 0;
      rows.forEach((r, i) => { if (r[s.key] > rows[peak][s.key]) peak = i; });
      rows.forEach((r, i) => {
        const x = cx(i) - w / 2, yt = y(r[s.key]), rr = Math.min(4, w / 2, y0 - yt);
        g += `<path d="M${x},${y0} V${yt + rr} Q${x},${yt} ${x + rr},${yt} H${x + w - rr} Q${x + w},${yt} ${x + w},${yt + rr} V${y0} Z" fill="${s.color}"/>`;
      });
      const px = Math.min(Math.max(cx(peak), m.l + 36), W - m.r - 36);
      g += `<text x="${px}" y="${y(rows[peak][s.key]) - 6}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--fg)">${o.labelFmt(rows[peak][s.key])}</text>`;
    } else {
      o.series.forEach(s => {
        const pts = rows.map((r, i) => `${cx(i).toFixed(1)},${y(r[s.key]).toFixed(1)}`).join(" ");
        g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
        const li = n - 1, v = rows[li][s.key];
        g += `<circle cx="${cx(li)}" cy="${y(v)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
        g += `<text x="${cx(li) + 10}" y="${y(v) + 4}" font-size="12" font-weight="600" fill="var(--fg)">${o.labelFmt(v)}</text>`;
      });
    }
    (o.ref || []).forEach(f => {
      g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(f.v)}" y2="${y(f.v)}" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".75"/>`;
    });
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.aria)}">${g}<g id="hv"></g><rect class="hit" x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="transparent"/></svg><div class="tip" hidden></div>`;
    host.dataset.w = W;
    const svg = host.querySelector("svg"), hv = svg.querySelector("#hv"), tip = host.querySelector(".tip"), hit = svg.querySelector(".hit");
    const show = e => {
      const rect = svg.getBoundingClientRect(), scale = W / rect.width;
      let i = Math.floor(((e.clientX - rect.left) * scale - m.l) / band);
      i = Math.max(0, Math.min(n - 1, i));
      const r = rows[i];
      let h = o.kind === "bar"
        ? `<rect x="${cx(i) - band / 2}" y="${m.t}" width="${band}" height="${ph}" fill="var(--hover)"/>`
        : `<line x1="${cx(i)}" x2="${cx(i)}" y1="${m.t}" y2="${m.t + ph}" stroke="var(--muted)" stroke-width="1"/>`;
      if (o.kind === "line") o.series.forEach(s => { h += `<circle cx="${cx(i)}" cy="${y(r[s.key])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`; });
      hv.innerHTML = h;
      tip.innerHTML = `<b>${fmt.format(parse(r.date))}</b>` + o.series.map(s => `<div class="row"><span class="sw" style="background:${s.color}"></span>${s.name}: <b>${o.tipFmt(r[s.key])}</b></div>`).join("");
      tip.hidden = false;
      const tw = tip.offsetWidth, px = cx(i) / scale;
      tip.style.left = Math.max(0, Math.min(px + 14 > rect.width - tw ? px - tw - 14 : px + 14, rect.width - tw)) + "px";
    };
    hit.addEventListener("pointermove", show);
    hit.addEventListener("pointerdown", show);
    hit.addEventListener("pointerleave", () => { hv.innerHTML = ""; tip.hidden = true; });
  }
  function mountChart(host, opts) {
    const run = () => drawChart(host, opts);
    run();
    charts.push({ host, run });
  }

  // ---------- reports ----------
  const reports = KEYS.map(k => {
    const r = DATA[k].report, rows = r.rows.map(x => ({ date: x[0], spend: x[1], m1: x[2], m2: x[3] }));
    return { ...r, key: k, data: rows, s: parse(rows[0].date), e: parse(rows[rows.length - 1].date) };
  });

  function goalCard(title, headChip, big, bigChip, lines) {
    return `<div class="goal"><div class="top"><span class="k">${title}</span>${headChip || ""}</div>
      <div class="vrow"><span class="v">${big}</span>${bigChip || ""}</div>
      <ul>${lines.map(l => `<li>${l}</li>`).join("")}</ul></div>`;
  }
  function spendCard(total, n, T, daysOnLine) {
    const avg = total / n, has = T.dailySpend != null;
    const lines = [];
    if (has) lines.push(`Average per day · target <b>${usd0.format(T.dailySpend)}/day</b> (<b>${dec1(avg / T.dailySpend * 100)}%</b> reached)`,
      `Total: <b>${usd.format(total)}</b> of ${usd.format(T.dailySpend * n)} (${n} days)`);
    else lines.push(`Average per day · no daily target set`, `Total: <b>${usd.format(total)}</b> (${n} days)`);
    if (daysOnLine) lines.push(daysOnLine);
    return goalCard("Daily spend", has ? chip(avg >= T.dailySpend, avg >= T.dailySpend ? "On target" : "Below target") : "", usd.format(avg), has ? spendChip(avg, T.dailySpend) : "", lines);
  }
  function marginCard(title, v, T, lines) {
    const ok = v >= T.margin;
    return goalCard(title, chip(ok, ok ? "Good" : "Below target"), pct1(v), marginChip(v, T.margin), lines);
  }
  function roasCard(title, v, T, lines) {
    const ok = v >= T.roas;
    return goalCard(title, chip(ok, ok ? "On target" : "Below target"), roasF(v), roasChip(v, T.roas), lines);
  }

  function renderReports() {
    const P = $("panel-rel"), S = DATA[scopeKey], r = reports.find(x => x.key === scopeKey), T = r.targets;
    const minS = new Date(Math.min(...reports.map(x => x.s))), maxE = new Date(Math.max(...reports.map(x => x.e)));
    charts.length = 0;

    // timeline
    const start = new Date(minS.getFullYear(), minS.getMonth(), 1);
    const endBase = new Date(Math.max(maxE, TODAY));
    const end = new Date(endBase.getFullYear(), endBase.getMonth() + 1, 1), span = end - start;
    const pct = d => ((d - start) / span * 100).toFixed(3) + "%";
    let ticks = "", grid = "";
    for (let d = new Date(start); d < end; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
      ticks += `<span class="tl-tick${d.getTime() === start.getTime() ? " first" : ""}" style="left:${pct(d)}">${fmtMD.format(d)}</span>`;

    }
    const tlRows = reports.map(x => `<div class="tl-row"><div class="tl-bar" style="left:${pct(x.s)};width:${(((x.e - x.s) + DAY) / span * 100).toFixed(3)}%${x.key === scopeKey ? "" : ";opacity:.55"}" title="${esc(x.name)}: ${fmt.format(x.s)} – ${fmt.format(x.e)}">${esc(DATA[x.key].label)}</div></div>`).join("");
    const tlToday = `<span class="tl-today" style="left:${pct(TODAY)}"><span>today</span></span>`;

    // list
    const list = reports.map(x => {
      const n = days(x.s, x.e);

    }).join("");

    // goals
    const data = r.data, nd = data.length, dTotal = sum(data.map(d => d.spend));
    const wd = k => sum(data.map(d => d.spend * d[k])) / dTotal;
    const dOk = (k) => data.filter(d => d[k] >= T.margin).length;
    const spendOnDays = T.dailySpend != null ? `Days on target: <b>${data.filter(d => d.spend >= T.dailySpend).length} of ${nd}</b>` : "";
    const rowA = spendCard(dTotal, nd, T, spendOnDays) +
      [["Margin %", "m1"], ["Margin % 2", "m2"]].map(([title, k]) => marginCard(title, wd(k), T, [
        `Spend-weighted · target <b>${pctT(T.margin)}</b>`,
        `Simple average of days: <b>${pct1(mean(data.map(d => d[k])))}</b> (${mean(data.map(d => d[k])) >= T.margin ? "on target" : "below target"})`,
        `Days on target: <b>${dOk(k)} of ${nd}</b>`])).join("");

    const ADS = S.adsets, A = aggBy(ADS), w = days(parse(S.source.since), parse(S.source.until));
    const inWin = data.filter(d => d.date >= S.source.since && d.date <= S.source.until);
    const winSum = sum(inWin.map(d => d.spend));
    const withM = k => ADS.filter(a => a[k] != null);
    const rowB = spendCard(A.spend, w, T, T.dailySpend != null ? `Days on target: <b>${inWin.filter(d => d.spend >= T.dailySpend).length} of ${inWin.length}</b> (daily report)` : "") +
      [["Margin %", "m1"], ["Margin % 2", "m2"]].map(([title, k]) => marginCard(title, A[k], T, [
        `Spend-weighted across ad sets · target <b>${pctT(T.margin)}</b>`,
        `Ad sets on target: <b>${withM(k).filter(a => a[k] >= T.margin).length} of ${withM(k).length}</b> with margin data`])).join("") +
      [["ROAS site", "roasWeb"], ["ROAS offline", "roasOff"]].map(([title, k]) => roasCard(title, A[k], T, [
        `Spend-weighted across ad sets · target <b>${T.roas}</b>`,
        `Ad sets on target: <b>${ADS.filter(a => a[k] >= T.roas).length} of ${ADS.length}</b>`])).join("");

    // table
    const tRows = `<tr class="total"><td>Total (${nd} days)</td><td>${usd.format(dTotal)}${T.dailySpend != null ? spendChip(dTotal, T.dailySpend * nd) : ""}</td><td>${pct1(wd("m1"))}${marginChip(wd("m1"), T.margin)}</td><td>${pct1(wd("m2"))}${marginChip(wd("m2"), T.margin)}</td></tr>` +
      data.map(d => `<tr><td>${fmt.format(parse(d.date))}</td><td>${usd.format(d.spend)}${T.dailySpend != null ? spendChip(d.spend, T.dailySpend) : ""}</td><td>${pct1(d.m1)}${marginChip(d.m1, T.margin)}</td><td>${pct1(d.m2)}${marginChip(d.m2, T.margin)}</td></tr>`).join("");

    P.innerHTML = `
      <div class="tiles">
        <div class="tile"><span class="k">Reports</span><span class="v">${reports.length}</span></div>
        <div class="tile"><span class="k">Period covered</span><span class="v small">${fmt.format(minS)} – ${fmt.format(maxE)}</span></div>
        <div class="tile"><span class="k">Data through</span><span class="v small">${fmt.format(maxE)}</span></div>
      </div>
      <section>
        <div class="section-head"><h2>Periods</h2><span class="hint">Orange line: today</span></div>
        <div class="timeline"><div class="tl-scroll"><div class="tl-inner"><div class="tl-axis">${ticks}</div>${grid}${tlToday}${tlRows}</div></div></div>
      </section>
      <section>
        <div class="section-head"><h2>Reports</h2><span class="hint">${reports.length} reports</span></div>
        <div class="list">${list}</div>
      </section>
      <section class="detail">
        <div class="section-head"><h2>${esc(S.label)} · targets</h2><span class="hint">${T.dailySpend != null ? usd0.format(T.dailySpend) + "/day spend · " : ""}Margin ≥ ${pctT(T.margin)} · ROAS ≥ ${T.roas}</span></div>
        <div class="sub"><h3>Full period · ${fmt.format(r.s)} – ${fmt.format(r.e)}</h3><span class="hint">Daily report</span></div>
        <div class="goals">${rowA}</div>
        <div class="sub"><h3>Last ${w} days · ${fmtMD.format(parse(S.source.since))} – ${fmt.format(parse(S.source.until))}</h3><span class="hint">Ad sets (source of truth)</span></div>
        <div class="goals">${rowB}</div>
        <div class="chart-card">
          <div class="chart-head"><h3>Spend per day (USD)</h3>${T.dailySpend != null ? `<div class="legend"><span><i class="dash"></i>Target ${usd0.format(T.dailySpend)}/day</span></div>` : ""}</div>
          <div class="chart" id="c-spend"></div>
        </div>
        <div class="chart-card">
          <div class="chart-head"><h3>Margin % per day</h3>
            <div class="legend"><span><i style="background:var(--s1)"></i>Margin %</span><span><i style="background:var(--s2)"></i>Margin % 2</span><span><i class="dash"></i>Target ${pctT(T.margin)}</span></div></div>
          <div class="chart" id="c-margin"></div>

          <div class="tbl-scroll"><table>
            <thead><tr><th>Day</th><th>Spend (USD)</th><th>Margin %</th><th>Margin % 2</th></tr></thead>
            <tbody>${tRows}</tbody>
          </table></div>
          <p class="note">Total row: spend and spend-weighted margins from the daily report. The last-${w}-days cards use the ad set sum (source of truth); the daily report adds up to ${usd.format(winSum)} for the same days (difference of ${usd.format(Math.abs(A.spend - winSum))}).</p>
        </div>
      </section>`;

    const maxSpend = Math.max(...data.map(d => d.spend));
    const sMax = Math.ceil(maxSpend * 1.1 / 5000) * 5000, sTicks = [];
    for (let v = 0; v <= sMax; v += 5000) sTicks.push(v);
    mountChart($("c-spend"), {
      kind: "bar", rows: data, yMax: sMax, yTicks: sTicks,
      yFmt: v => int.format(v), labelFmt: v => usd0.format(v), tipFmt: v => usd.format(v),
      series: [{ key: "spend", name: "Spend", color: "var(--s1)" }],
      ref: T.dailySpend != null ? [{ v: T.dailySpend, label: int.format(T.dailySpend) }] : [],
      aria: `Spend per day in US dollars, ${fmt.format(r.s)} to ${fmt.format(r.e)}` + (T.dailySpend != null ? `, with a target of ${usd0.format(T.dailySpend)} per day` : "")
    });
    const allM = data.flatMap(d => [d.m1, d.m2]);
    const mMin = Math.min(0, Math.floor(Math.min(...allM) * 10) / 10), mMax = Math.max(0.3, Math.ceil(Math.max(...allM) * 10) / 10), mTicks = [];
    for (let v = mMin; v <= mMax + 1e-9; v += 0.1) mTicks.push(Math.round(v * 10) / 10);
    mountChart($("c-margin"), {

      yFmt: v => (v < -1e-9 ? "−" : "") + Math.abs(Math.round(v * 100)) + "%",
      labelFmt: v => (v < 0 ? "−" : "") + pct1(Math.abs(v)), tipFmt: v => (v < 0 ? "−" : "") + pct1(Math.abs(v)),
      series: [{ key: "m1", name: "Margin %", color: "var(--s1)" }, { key: "m2", name: "Margin % 2", color: "var(--s2)" }],
      ref: [{ v: T.margin, label: pctT(T.margin) }],
      aria: `Margin % and Margin % 2 per day, ${fmt.format(r.s)} to ${fmt.format(r.e)}, with a target of ${pctT(T.margin)}`

  }

  // ---------- campaigns ----------
  const adState = { camp: "all", key: "spend", dir: -1 };
  function renderCampaigns() {
    const P = $("panel-camp"), S = DATA[scopeKey], ADS = S.adsets, T = S.report.targets, ents = ENTRIES[scopeKey];
    const roasCell = v => v == null ? "—" : roasF(v) + (T.roas != null ? roasChip(v, T.roas) : "");
    const mCell = v => v == null ? "—" : pct1(v) + marginChip(v, T.margin);
    const lastEntry = id => ents.filter(e => e.adset.id === id).sort((a, b) => (b.date - a.date) || (b.mins - a.mins))[0];

    const camps = [...groups.values()].map(g => ({ ...g, a: aggBy(g.list) })).sort((x, y) => y.a.spend - x.a.spend);
    const all = aggBy(ADS);
    const rep = reports.find(x => x.key === scopeKey);
    const inWin = rep.data.filter(d => d.date >= S.source.since && d.date <= S.source.until);

    P.innerHTML = `
      <div class="tiles">

            <tbody>${campRow("All campaigns", all, "", "total") + camps.map(c => campRow(campShort(c.name), c.a, c.name)).join("")}</tbody>
          </table></div>
          <p class="note">ROAS and Margin % per campaign are spend-weighted averages of the ad sets. The basis of Margin % was not provided, so aggregated margin is an approximation. The daily report adds up to ${usd.format(winSum)} for the same days (difference of ${usd.format(Math.abs(all.spend - winSum))}). Chips compare with the targets: Margin ≥ ${pctT(T.margin)}, ROAS ≥ ${T.roas}.</p>

          <div class="tbl-scroll"><table><thead id="ad-thead"></thead><tbody id="ad-tbody"></tbody></table></div>
        </div>

      }).join("");
      $("ad-count").textContent = list.length + (list.length === 1 ? " ad set" : " ad sets");
    }
    sel.addEventListener("change", () => { adState.camp = sel.value; renderAdsets(); });
    $("ad-thead").addEventListener("click", e => {
      const b = e.target.closest(".sort");
      if (!b) return;
      const k = b.dataset.k;
      if (adState.key === k) adState.dir *= -1; else { adState.key = k; adState.dir = (k === "name" || k === "camp") ? 1 : -1; }
      renderAdsets();
    });
    renderAdsets();
  }

  // ---------- optimizations log ----------
  function renderOpts() {
    const P = $("panel-opt"), S = DATA[scopeKey], ADS = S.adsets, ents = ENTRIES[scopeKey];
    const rep = reports.find(x => x.key === scopeKey);
    $("opt-count").textContent = ents.length;
    const last = ents.slice().sort((a, b) => (b.date - a.date) || (b.mins - a.mins))[0];
    const noOpt = ADS.filter(a => !ents.some(e => e.adset.id === a.id)).length;
    const noAp = ents.filter(e => !e.ap).length;
    const tiles = [
      ["Recorded optimizations", String(ents.length), "", ""],
      ["Ad sets in export", String(ADS.length), "", noOpt ? noOpt + " without a record in the name" : "all have a record"],
      ["Latest optimization", last ? fmt.format(last.date) + " " + timeLabel(last) : "—", "small", ""],
      ["Time without AM/PM", String(noAp), "", noAp ? "morning or afternoon cannot be confirmed" : ""]
    ].map(t => `<div class="tile"><span class="k">${t[0]}</span><span class="v ${t[2]}">${t[1]}</span>${t[3] ? `<span class="n">${t[3]}</span>` : ""}</div>`).join("");

    const how = `<span>Ad set name: <code>NAME_OPT_MM/DD/YYYY+2@h:mmAM</code></span>` +
      `<span><b>+2</b> / <b>−2</b> = bid cap change · a <b>$</b> prefix (<code>$+N</code>) = budget change, value as written in the name.</span>` +
      `<span>Source: ${esc(S.source.label)}, ${fmt.format(parse(S.source.since))} – ${fmt.format(parse(S.source.until))}${S.history.length ? ", plus entries kept from an earlier export" : ""}. A rename overwrites the previous entry, so days before the earliest export may be incomplete.` +
      (last && rep.e < last.date ? ` Daily data ends ${fmt.format(rep.e)}, so the latest optimizations are not reflected in it yet.` : "") + `</span>`;

    const byDay = new Map();
    ents.forEach(e => { const k = e.date.getTime(); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(e); });
    const log = !ents.length ? `<div class="how">No optimizations found in the ad set names.</div>` :
      [...byDay.keys()].sort((a, b) => b - a).map(k => {
        const list = byDay.get(k).sort((a, b) => (b.mins - a.mins) || a.set.localeCompare(b.set));
        const counts = {};
        list.forEach(e => { const a = actionKey(e); counts[a] = (counts[a] || 0) + 1; });
        const summary = Object.entries(counts).map(([a, c]) => c + "× " + a).join(" · ");
        return `<div class="day">
          <div class="day-head"><h3>${fmt.format(new Date(k))}</h3><span class="hint">${list.length} ${list.length === 1 ? "optimization" : "optimizations"} · ${summary}</span></div>
          <ul class="log">${list.map(e => `<li class="log-item">
            <span class="log-time">${timeLabel(e)}</span>
            <div class="log-body">
              <div class="log-top"><b>${esc(e.set)}</b><span class="camp" title="${esc(e.campFull)}">${esc(e.camp)}</span>${actionChip(e)}${e.ap ? "" : `<span class="chip warn">AM/PM not specified</span>`}</div>
              <span class="log-meta">${e.hist ? "From an earlier export" : `Bid in CSV: ${esc(e.adset.bid)} · Daily budget: ${num2.format(e.adset.budget)}`} · Created ${fmt.format(parse(e.adset.created))}</span>
              <span class="log-raw">${esc(e.name)}</span>
            </div></li>`).join("")}</ul>
        </div>`;
      }).join("");
    P.innerHTML = `<div class="tiles">${tiles}</div><div class="how">${how}</div><div style="display:flex;flex-direction:column;gap:20px">${log}</div>`;
  }

  // ---------- team message ----------
  const sgnA = v => (v > 0 ? "+" : "-") + Math.abs(v);
  const actionText = e => e.kind === "bid" ? sgnA(e.amount) + " bidcap" : e.kind === "budget" ? "$" + sgnA(e.amount) + " budget" : "optimization (action not specified)";
  const msgCamp = s => s === "HOLIDAY" ? "Holiday" : s.replace(/_/g, " ");
  const onDate = (k, t) => ENTRIES[k].filter(e => e.date.getTime() === t).sort((a, b) => (a.mins - b.mins) || (a.order - b.order));
  function buildMessage(t) {
    const d = new Date(t), L = [];
    const z = onDate("zones", t), s = onDate("states", t);
    L.push(`Zones Opts ${md(d)}`, "");
    if (!z.length) L.push("* No optimizations recorded");
    const groups = new Map();
    z.forEach(e => { if (!groups.has(e.camp)) groups.set(e.camp, []); groups.get(e.camp).push(e); });
    groups.forEach((list, camp) => {
      L.push(`* ${msgCamp(camp)}:`);
      list.forEach(e => L.push(`   * ${e.set}: ${actionText(e)}`));
    });
    L.push("", "");
    L.push("* States Opts:");
    if (!s.length) L.push("   * No optimizations recorded");
    const dup = {};
    s.forEach(e => { dup[e.set] = (dup[e.set] || 0) + 1; });
    s.forEach(e => L.push(`   * ${e.set}${dup[e.set] > 1 ? " (" + e.camp + ")" : ""}: ${actionText(e)}`));
    return L.join("\n");
  }
  function renderMessage() {
    const P = $("panel-msg");
    const dates = [...new Set(KEYS.flatMap(k => ENTRIES[k].map(e => e.date.getTime())))].sort((a, b) => b - a);
    P.innerHTML = `
      <section>
        <div class="section-head"><h2>Team message</h2><span class="hint">Built from the optimizations in the ad set names</span></div>
        <div class="msg-card">
          <div class="tools"><label for="msg-date">Date</label><select id="msg-date">${dates.map(t => `<option value="${t}">${fmt.format(new Date(t))} (${md(new Date(t))})</option>`).join("")}</select><span class="hint" id="msg-count"></span></div>
          <textarea id="msg-text" spellcheck="false" aria-label="Message to the team"></textarea>
          <div class="msg-actions"><button class="btn" id="msg-copy" type="button">Copy message</button><span class="status" id="msg-status" role="status"></span></div>
          <p class="note">The text is editable before copying. Entries come from the ad set names; a rename overwrites an ad set's previous entry, so earlier days can be incomplete.</p>
        </div>
      </section>`;
    const sel = $("msg-date"), ta = $("msg-text"), st = $("msg-status");
    const fill = () => {
      const t = Number(sel.value);
      ta.value = buildMessage(t);
      ta.style.height = "auto"; ta.style.height = (ta.scrollHeight + 4) + "px";
      $("msg-count").textContent = `Zones: ${onDate("zones", t).length} · States: ${onDate("states", t).length}`;
      st.textContent = "";
    };
    sel.addEventListener("change", fill);
    $("msg-copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(ta.value); st.textContent = "Copied"; }
      catch (e) { ta.focus(); ta.select(); st.textContent = "Text selected. Press Ctrl+C (Cmd+C on Mac) to copy."; }
    });
    fill();
  }

  // ---------- tabs and scope ----------
  const TABS = ["rel", "camp", "opt", "msg"];
  function showTab(k, focus) {
    tabKey = k;
    TABS.forEach(x => {
      const on = x === k;
      $("tab-" + x).setAttribute("aria-selected", on);
      $("tab-" + x).tabIndex = on ? 0 : -1;
      $("panel-" + x).hidden = !on;
    });
    $("scope").hidden = k === "msg";
    if (focus) $("tab-" + k).focus();
    try { localStorage.setItem("ib-tab", k); } catch (e) {}
    redrawCharts();
  }
  function setScope(k) {
    scopeKey = k;
    document.querySelectorAll("#scope button").forEach(b => b.setAttribute("aria-pressed", b.dataset.scope === k));
    try { localStorage.setItem("ib-scope", k); } catch (e) {}
    renderReports(); renderCampaigns(); renderOpts();
    redrawCharts();
  }
  TABS.forEach(k => $("tab-" + k).addEventListener("click", () => showTab(k)));
  $("tab-rel").parentElement.addEventListener("keydown", e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const i = TABS.findIndex(k => $("tab-" + k) === document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    showTab(TABS[(i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length], true);
  });
  document.querySelectorAll("#scope button").forEach(b => b.addEventListener("click", () => setScope(b.dataset.scope)));

  renderMessage();
  let startScope = "zones", startTab = "rel";
  try {
    const s = localStorage.getItem("ib-scope"), t = localStorage.getItem("ib-tab");
    if (s && DATA[s]) startScope = s;
    if (t && TABS.includes(t)) startTab = t;
  } catch (e) {}
  setScope(startScope);
  if (startTab !== "rel") showTab(startTab);
</script>
