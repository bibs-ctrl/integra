<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>

  :root {
    --bg: #f6f3f5;
    --surface: #ffffff;
    --row: #f4edf6;
    --fg: #2b1f2e;
    --muted: #6f6272;
    --line: #e3dce5;
    --accent: #6b2e5f;
    --accent-fg: #ffffff;
    --accent-soft: #eddff0;
    --ok: #1f7a4d;
    --ok-soft: #dff1e7;
    --bad: #a8322d;
    --bad-soft: #f8e1df;
    --warn: #8a5a00;
    --warn-soft: #fbefd2;
    --info: #3a4f8f;
    --info-soft: #e1e7f7;
    --s1: #2a78d6;
    --s2: #eb6834;
    --grid: #ece6ee;
    --hover: rgba(107, 46, 95, 0.08);
    --font-display: "Instrument Serif", Georgia, serif;
    --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a121c;
      --surface: #251a28;
      --row: #2e2132;
      --fg: #f0e7f2;
      --muted: #a898ac;
      --line: #3a2c3e;
      --accent: #d9a2cc;
      --accent-fg: #2a1428;
      --accent-soft: #3d2840;
      --ok: #7fd1a3;
      --ok-soft: #1f3a2d;
      --bad: #f09a95;
      --bad-soft: #4a2326;
      --warn: #f0c970;
      --warn-soft: #3d3214;
      --info: #a9bbf0;
      --info-soft: #25305a;
      --s1: #3987e5;
      --s2: #d95926;
      --grid: #382b3b;
      --hover: rgba(217, 162, 204, 0.12);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a121c;
    --surface: #251a28;
    --row: #2e2132;
    --fg: #f0e7f2;
    --muted: #a898ac;
    --line: #3a2c3e;
    --accent: #d9a2cc;
    --accent-fg: #2a1428;
    --accent-soft: #3d2840;
    --ok: #7fd1a3;
    --ok-soft: #1f3a2d;
    --bad: #f09a95;
    --bad-soft: #4a2326;
    --warn: #f0c970;
    --warn-soft: #3d3214;
    --info: #a9bbf0;
    --info-soft: #25305a;
    --s1: #3987e5;
    --s2: #d95926;
    --grid: #382b3b;
    --hover: rgba(217, 162, 204, 0.12);
    color-scheme: dark;
  }

  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 28px 56px; }
  .wrap { max-width: 980px; margin-inline: auto; display: flex; flex-direction: column; gap: 24px; }
  .panel { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
  .panel[hidden] { display: none; }
  h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(34px, 6vw, 52px); line-height: 1.05; letter-spacing: -0.01em; }
  h2 { font-size: 24px; }
  h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .eyebrow { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  header { display: flex; flex-direction: column; gap: 8px; }
  header p { margin: 0; color: var(--muted); max-width: 62ch; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 10px 14px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .tab:hover { color: var(--fg); }
  .tab:focus-visible { outline: 3px solid var(--fg); outline-offset: -3px; border-radius: 6px; }
  .tab .count { display: inline-block; min-width: 20px; text-align: center; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .tile .k { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .tile .v { font-size: 26px; line-height: 1.15; font-weight: 600; overflow-wrap: anywhere; }
  .tile .v.small { font-size: 18px; }
  .tile .n { font-size: 12px; color: var(--muted); }

  section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 13px; }

  .timeline { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .tl-scroll { overflow-x: auto; }
  .tl-inner { min-width: 520px; position: relative; }
  .tl-axis { position: relative; height: 22px; border-bottom: 1px solid var(--line); }
  .tl-tick { position: absolute; top: 0; font-size: 11px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tl-tick.first { transform: none; }
  .tl-row { position: relative; height: 34px; border-bottom: 1px dashed var(--line); }
  .tl-row:last-child { border-bottom: 0; }
  .tl-bar { position: absolute; top: 7px; height: 20px; border-radius: 4px; background: var(--accent); min-width: 6px; }
  .tl-bar.is-live { background: var(--ok); }
  .tl-grid { position: absolute; top: 22px; bottom: 0; width: 1px; background: var(--line); opacity: .6; }
  .tl-today { position: absolute; top: 22px; bottom: 0; width: 2px; background: var(--warn); }
  .tl-today span { position: absolute; top: -22px; right: 6px; font-size: 11px; color: var(--warn); font-weight: 600; }
  .tl-empty { color: var(--muted); font-size: 14px; padding-block: 8px; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .report { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; grid-template-columns: 1fr auto; gap: 12px 16px; align-items: center; }
  .report .main { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .report .name { font-weight: 600; font-size: 16px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .meta b { color: var(--fg); font-weight: 500; }
  .pill { display: inline-flex; align-items: center; width: fit-content; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.info { background: var(--info-soft); color: var(--info); }
  .pill.off { background: var(--accent-soft); color: var(--accent); }
  .open { background: var(--accent); color: var(--accent-fg); text-decoration: none; font-weight: 600; padding: 10px 16px; border-radius: 8px; white-space: nowrap; }
  .open:hover { filter: brightness(1.08); }
  .open:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .url { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }

  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .chip.good { background: var(--ok-soft); color: var(--ok); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.info { background: var(--info-soft); color: var(--info); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.acc { background: var(--accent-soft); color: var(--accent); }

  .detail { display: flex; flex-direction: column; gap: 14px; }
  .goals { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; }
  .goal { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .goal .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .goal .k { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .goal .v { font-size: 28px; line-height: 1.1; font-weight: 600; }
  .goal .vrow { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; }
  .goal .vrow .chip { margin: 0; }
  .goal ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .goal ul b { color: var(--fg); font-weight: 600; }
  .chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 14px; height: 2px; border-radius: 1px; vertical-align: middle; margin-right: 6px; }
  .legend i.dash { height: 0; background: none; border-top: 2px dashed var(--fg); border-radius: 0; opacity: .7; }
  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: var(--font-body); }
  .tip { position: absolute; top: 0; pointer-events: none; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5; box-shadow: 0 4px 14px rgba(0,0,0,.14); white-space: nowrap; z-index: 2; }
  .tip b { font-weight: 600; }
  .tip .row { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .tip .sw { width: 8px; height: 8px; border-radius: 50%; }
  .tbl-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--surface); }
  tr.total td { background: var(--row); font-weight: 600; }
  td .chip { margin-left: 6px; }

  .how { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .how code, .log-raw { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--fg); overflow-wrap: anywhere; }
  .day { display: flex; flex-direction: column; gap: 8px; }
  .day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; }
  .day-head h3 { font-size: 16px; }
  .log { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .log-item { display: grid; grid-template-columns: 96px 1fr; gap: 4px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .log-item:last-child { border-bottom: 0; }
  .log-time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
  .log-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .log-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .log-top b { font-weight: 600; }
  .log-meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .camp { font-size: 12px; font-weight: 600; color: var(--muted); }
  .share { display: inline-flex; align-items: center; gap: 8px; }
  .bar { display: inline-block; width: 56px; height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--s1); border-radius: 4px; }
  .tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  select { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 100%; }
  select:focus-visible, .sort:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .sort { appearance: none; background: none; border: 0; padding: 0; font: inherit; color: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .sort:hover { color: var(--fg); }
  .note { margin: 0; font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) {
    .report { grid-template-columns: 1fr; } .open { text-align: center; }
    .log-item { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: no-preference) { .tip { transition: left .05s linear; } }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">Meta Ads · Time Zones</span>

      if (i % step === 0) {
        const d = parse(r.date);
        g += `<text x="${cx(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}</text>`;
      }
    });
    if (o.kind === "bar") {
      const s = o.series[0], w = Math.min(24, Math.max(band - 2, 3)), y0 = y(0);
      let peak = 0;
      rows.forEach((r, i) => { if (r[s.key] > rows[peak][s.key]) peak = i; });
      rows.forEach((r, i) => {
        const x = cx(i) - w / 2, yt = y(r[s.key]), rr = Math.min(4, w / 2, y0 - yt);
        g += `<path d="M${x},${y0} V${yt + rr} Q${x},${yt} ${x + rr},${yt} H${x + w - rr} Q${x + w},${yt} ${x + w},${yt + rr} V${y0} Z" fill="${s.color}"/>`;
      });
      const px = Math.min(Math.max(cx(peak), m.l + 36), W - m.r - 36);
      g += `<text x="${px}" y="${y(rows[peak][s.key]) - 6}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--fg)">${o.labelFmt(rows[peak][s.key])}</text>`;
    } else {
      o.series.forEach(s => {
        const pts = rows.map((r, i) => `${cx(i).toFixed(1)},${y(r[s.key]).toFixed(1)}`).join(" ");
        g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
        const li = n - 1, v = rows[li][s.key];
        g += `<circle cx="${cx(li)}" cy="${y(v)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
        g += `<text x="${cx(li) + 10}" y="${y(v) + 4}" font-size="12" font-weight="600" fill="var(--fg)">${o.labelFmt(v)}</text>`;
      });
    }
    (o.ref || []).forEach(f => {
      g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(f.v)}" y2="${y(f.v)}" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".75"/>`;
      g += `<text x="${W - m.r + 8}" y="${y(f.v) - 1}" font-size="11" font-weight="600" fill="var(--fg)">Meta</text>`;
      g += `<text x="${W - m.r + 8}" y="${y(f.v) + 12}" font-size="11" fill="var(--muted)">${f.label}</text>`;
    });
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.aria)}">${g}<g id="hv"></g><rect class="hit" x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="transparent"/></svg><div class="tip" hidden></div>`;
    host.dataset.w = W;
    const svg = host.querySelector("svg"), hv = svg.querySelector("#hv"), tip = host.querySelector(".tip"), hit = svg.querySelector(".hit");
    const show = e => {
      const rect = svg.getBoundingClientRect(), scale = W / rect.width;
      let i = Math.floor(((e.clientX - rect.left) * scale - m.l) / band);
      i = Math.max(0, Math.min(n - 1, i));
      const r = rows[i];
      let h = o.kind === "bar"
        ? `<rect x="${cx(i) - band / 2}" y="${m.t}" width="${band}" height="${ph}" fill="var(--hover)"/>`
        : `<line x1="${cx(i)}" x2="${cx(i)}" y1="${m.t}" y2="${m.t + ph}" stroke="var(--muted)" stroke-width="1"/>`;
      if (o.kind === "line") o.series.forEach(s => { h += `<circle cx="${cx(i)}" cy="${y(r[s.key])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`; });
      hv.innerHTML = h;
      const d = parse(r.date);
      tip.innerHTML = `<b>${fmt.format(d)}</b>` + o.series.map(s => `<div class="row"><span class="sw" style="background:${s.color}"></span>${s.name}: <b>${o.tipFmt(r[s.key])}</b></div>`).join("");
      tip.hidden = false;
      const tw = tip.offsetWidth, px = cx(i) / scale;
      tip.style.left = Math.max(0, Math.min(px + 14 > rect.width - tw ? px - tw - 14 : px + 14, rect.width - tw)) + "px";
    };
    hit.addEventListener("pointermove", show);
    hit.addEventListener("pointerdown", show);
    hit.addEventListener("pointerleave", () => { hv.innerHTML = ""; tip.hidden = true; });
  }

  const charts = [];
  const redrawCharts = () => charts.forEach(c => { const w = c.host.clientWidth; if (w && Math.abs(w - Number(c.host.dataset.w)) > 1) c.run(); });
  function mountChart(host, opts) {
    const run = () => drawChart(host, opts);
    run();
    charts.push({ host, run });
  }
  if (window.ResizeObserver) new ResizeObserver(redrawCharts).observe(document.body);

  // ---------- Metas e detalhe por relatório ----------
  reports.filter(r => r.fromCsv).forEach((r, idx) => {
    const data = r.rows.map(x => ({ date: x[0], spend: x[1], m1: x[2], m2: x[3] }));
    const T = r.targets;
    const useSot = r.sot === "adsets" && SOT;
    const nd = data.length, dTotal = data.reduce((x, d) => x + d.spend, 0);
    const n = useSot ? sotDays : nd, total = useSot ? SOT.spend : dTotal;
    const wavg = k => data.reduce((x, d) => x + d.spend * d[k], 0) / dTotal;
    const el = document.createElement("section");
    el.className = "detail";

    let goals = "", tableRows = "", legendSpend = "", legendMargin = "";
    if (T) {
      const avg = total / n, targetTotal = T.dailySpend * n;
      const spendDays = data.filter(d => d.spend >= T.dailySpend).length;
      const spendOk = avg >= T.dailySpend;
      const mCard = (title, k) => {
        const simple = mean(data.map(d => d[k])), w = wavg(k);
        const main = useSot ? SOT[k] : simple, ok = main >= T.margin;
        const dOk = data.filter(d => d[k] >= T.margin).length;
        const lines = useSot
          ? `<li>Ponderada pelo gasto dos conjuntos · meta <b>${pctT(T.margin)}</b></li>
            <li>Média simples dos dias (CSV diário): <b>${pct1(simple)}</b> (${simple >= T.margin ? "na meta" : "abaixo da meta"})</li>`
          : `<li>Média simples dos dias · meta <b>${pctT(T.margin)}</b></li>
            <li>Ponderada pelo gasto: <b>${pct1(w)}</b> (${w >= T.margin ? "na meta" : "abaixo da meta"})</li>`;
        return `<div class="goal">
          <div class="top"><span class="k">${title}</span>${chip(ok, ok ? "Boa" : "Abaixo da meta")}</div>
          <div class="vrow"><span class="v">${pct1(main)}</span>${marginChip(main, T.margin)}</div>
          <ul>
            ${lines}
            <li>Dias na meta: <b>${dOk} de ${nd}</b></li>
          </ul></div>`;
      };
      goals = `<div class="goals">
        <div class="goal">
          <div class="top"><span class="k">Investimento diário</span>${chip(spendOk, spendOk ? "Na meta" : "Abaixo da meta")}</div>
          <div class="vrow"><span class="v">${usd.format(avg)}</span>${spendChip(avg, T.dailySpend)}</div>
          <ul>
            <li>Média por dia · meta <b>${usd0.format(T.dailySpend)}/dia</b> (atingido <b>${dec1(avg / T.dailySpend * 100)}%</b>)</li>
            <li>Total: <b>${usd.format(total)}</b> de ${usd.format(targetTotal)} (${n} dias)</li>
            <li>Dias na meta: <b>${spendDays} de ${nd}</b></li>
          </ul>
        </div>
        ${mCard("Margin %", "m1")}
        ${mCard("Margin % 2", "m2")}
      </div>`;
      const mean1 = useSot ? SOT.m1 : mean(data.map(d => d.m1)), mean2 = useSot ? SOT.m2 : mean(data.map(d => d.m2));
      tableRows = `<tr class="total"><td>Geral (${n} dias${useSot ? ", soma dos conjuntos" : ""})</td><td>${usd.format(total)}${spendChip(total, targetTotal)}</td><td>${pct1(mean1)}${marginChip(mean1, T.margin)}</td><td>${pct1(mean2)}${marginChip(mean2, T.margin)}</td></tr>` +
        data.map(d => `<tr><td>${fmt.format(parse(d.date))}</td><td>${usd.format(d.spend)}${spendChip(d.spend, T.dailySpend)}</td><td>${pct1(d.m1)}${marginChip(d.m1, T.margin)}</td><td>${pct1(d.m2)}${marginChip(d.m2, T.margin)}</td></tr>`).join("");
      legendSpend = `<div class="legend"><span><i class="dash"></i>Meta ${usd0.format(T.dailySpend)}/dia</span></div>`;
      legendMargin = `<span><i class="dash"></i>Meta ${pctT(T.margin)}</span>`;
    } else {
      tableRows = data.map(d => `<tr><td>${fmt.format(parse(d.date))}</td><td>${usd.format(d.spend)}</td><td>${pct1(d.m1)}</td><td>${pct1(d.m2)}</td></tr>`).join("");
    }

    el.innerHTML = `
      <div class="section-head"><h2>${esc(r.name)}</h2><span class="hint">${fmt.format(r.s)} a ${fmt.format(r.e)} · ${useSot ? "totais: soma dos conjuntos de anúncios" : "dados do CSV"}</span></div>
      ${goals}
      <div class="chart-card">
        <div class="chart-head"><h3>Valor gasto por dia (USD)</h3>${legendSpend}</div>
        <div class="chart" id="c-spend-${idx}"></div>
      </div>
      <div class="chart-card">
        <div class="chart-head"><h3>Margin % por dia</h3>
          <div class="legend"><span><i style="background:var(--s1)"></i>Margin %</span><span><i style="background:var(--s2)"></i>Margin % 2</span>${legendMargin}</div></div>
        <div class="chart" id="c-margin-${idx}"></div>
      </div>
      <div class="chart-card">
        <div class="chart-head"><h3>Resultado por dia</h3>${T ? `<span class="hint">✓ na meta · ✕ abaixo, com a diferença para a meta</span>` : ""}</div>
        <div class="tbl-scroll"><table>
          <thead><tr><th>Dia</th><th>Valor gasto (USD)</th><th>Margin %</th><th>Margin % 2</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table></div>
        ${useSot ? `<p class="note">Geral: soma dos conjuntos de anúncios (fonte da verdade), margins ponderadas pelo gasto. Os dias vêm do CSV diário, que soma ${usd.format(dTotal)} (diferença de ${usd.format(Math.abs(total - dTotal))}).</p>` : ""}
      </div>`;
    document.getElementById("details").appendChild(el);
    mountChart(el.querySelector(`#c-spend-${idx}`), {
      kind: "bar", rows: data, yMax: 20000, yTicks: [0, 5000, 10000, 15000, 20000],
      yFmt: v => int.format(v), labelFmt: v => usd0.format(v), tipFmt: v => usd.format(v),
      series: [{ key: "spend", name: "Valor gasto", color: "var(--s1)" }],
      ref: T ? [{ v: T.dailySpend, label: int.format(T.dailySpend) }] : [],
      aria: "Valor gasto por dia em dólares, de " + fmt.format(r.s) + " a " + fmt.format(r.e) + (T ? ", com meta de " + usd0.format(T.dailySpend) + " por dia" : "")
    });
    mountChart(el.querySelector(`#c-margin-${idx}`), {
      kind: "line", rows: data, yMax: 0.4, yTicks: [0, 0.1, 0.2, 0.3, 0.4],
      yFmt: v => Math.round(v * 100) + "%", labelFmt: pct1, tipFmt: pct1,
      series: [{ key: "m1", name: "Margin %", color: "var(--s1)" }, { key: "m2", name: "Margin % 2", color: "var(--s2)" }],
      ref: T ? [{ v: T.margin, label: Math.round(T.margin * 100) + "%" }] : [],
      aria: "Margin % e Margin % 2 por dia, de " + fmt.format(r.s) + " a " + fmt.format(r.e) + (T ? ", com meta de " + pctT(T.margin) : "")
    });
  });

  // ---------- Otimizações ----------
  const OPT_RE = /(?:^|_)OPT_(\d{1,2})\/(\d{1,2})\/(\d{4})(\$?[+-]\d+(?:[.,]\d+)?)?@(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?/gi;
  const entries = [];
  ADSETS.forEach(a => {
    const base = a.name.split(/_?OPT_\d/i)[0];
    for (const m of a.name.matchAll(OPT_RE)) {
      const raw = m[4] || null, ap = m[7] ? m[7].toUpperCase() : null;
      const h = Number(m[5]), min = m[6] ? Number(m[6]) : 0;
      entries.push({
        set: base, camp: campShort(a.campaign), adset: a, name: a.name,
        date: new Date(Number(m[3]), Number(m[1]) - 1, Number(m[2])),
        kind: raw ? (raw.startsWith("$") ? "budget" : "bid") : "none",
        amount: raw ? parseFloat(raw.replace("$", "").replace(",", ".")) : null,
        h, min, ap,
        mins: (h % 12 + (ap === "PM" ? 12 : 0)) * 60 + min
      });
    }
  });
  const noOpt = ADSETS.filter(a => !entries.some(e => e.adset === a));
  const timeLabel = e => String(e.h).padStart(2, "0") + ":" + String(e.min).padStart(2, "0") + (e.ap ? " " + e.ap : "");
  const num = v => (v > 0 ? "+" : "−") + String(Math.abs(v)).replace(".", ",");
  const actionChip = e => {
    if (e.kind === "bid") return `<span class="chip ${e.amount >= 0 ? "info" : "warn"}"><span aria-hidden="true">${e.amount >= 0 ? "▲" : "▼"}</span>${num(e.amount)} bid cap</span>`;
    if (e.kind === "budget") return `<span class="chip acc"><span aria-hidden="true">$</span>${num(e.amount)} orçamento</span>`;
    return `<span class="chip warn">Ação não informada</span>`;
  };
  const actionKey = e => e.kind === "none" ? "ação não informada" : (e.kind === "bid" ? num(e.amount) + " bid cap" : "$" + num(e.amount) + " orçamento");

  document.getElementById("opt-count").textContent = entries.length;
  const last = entries.slice().sort((a, b) => (b.date - a.date) || (b.mins - a.mins))[0];
  const noAp = entries.filter(e => !e.ap).length;
  document.getElementById("opt-tiles").innerHTML = [
    ["Otimizações registradas", String(entries.length), "", ""],
    ["Conjuntos no CSV", String(ADSETS.length), "", noOpt.length ? noOpt.length + " sem registro no nome" : "todos com registro"],
    ["Última otimização", last ? fmt.format(last.date) + " " + timeLabel(last) : "—", "small", ""],
    ["Horário sem AM/PM", String(noAp), "", noAp ? "não dá para confirmar manhã ou tarde" : ""]
  ].map(t => `<div class="tile"><span class="k">${t[0]}</span><span class="v ${t[2]}">${t[1]}</span>${t[3] ? `<span class="n">${t[3]}</span>` : ""}</div>`).join("");

  document.getElementById("opt-how").innerHTML =
    `<span>Nome do conjunto: <code>NOME_OPT_MM/DD/AAAA+2@hh:mmAM</code></span>` +
    `<span><b>+2</b> / <b>−2</b> = alteração de bid cap · <b>$</b> no início (<code>$+N</code>) = alteração de orçamento, valor como escrito no nome.</span>` +
    `<span>Fonte: ${esc(ADSETS_SOURCE.label)}, ${fmt.format(parse(ADSETS_SOURCE.since))} a ${fmt.format(parse(ADSETS_SOURCE.until))}.` +
    (reports.some(r => r.fromCsv && r.e < (last ? last.date : TODAY)) ? ` Os dados diários dos relatórios terminam antes da última otimização, então o efeito ainda não aparece neles.` : "") + `</span>`;

  const byDay = new Map();
  entries.forEach(e => { const k = e.date.getTime(); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(e); });
  const logEl = document.getElementById("opt-log");
  if (!entries.length) {
    logEl.innerHTML = `<div class="how">Nenhuma otimização encontrada nos nomes dos conjuntos.</div>`;
  } else {
    logEl.innerHTML = [...byDay.keys()].sort((a, b) => b - a).map(k => {
      const list = byDay.get(k).sort((a, b) => (b.mins - a.mins) || a.set.localeCompare(b.set));
      const counts = {};
      list.forEach(e => { const a = actionKey(e); counts[a] = (counts[a] || 0) + 1; });
      const sum = Object.entries(counts).map(([a, c]) => c + "× " + a).join(" · ");
      return `<div class="day">
        <div class="day-head"><h3>${fmt.format(new Date(k))}</h3><span class="hint">${list.length} ${list.length === 1 ? "otimização" : "otimizações"} · ${sum}</span></div>
        <ul class="log">${list.map(e => `<li class="log-item">
          <span class="log-time">${timeLabel(e)}</span>
          <div class="log-body">
            <div class="log-top"><b>${esc(e.set)}</b><span class="camp" title="${esc(e.adset.campaign)}">${esc(e.camp)}</span>${actionChip(e)}${e.ap ? "" : `<span class="chip warn">AM/PM não informado</span>`}</div>
            <span class="log-meta">Lance no CSV: ${esc(e.adset.bid)} · Orçamento diário: ${num2.format(e.adset.budget)} · Criado em ${fmt.format(parse(e.adset.created))}</span>
            <span class="log-raw">${esc(e.name)}</span>
          </div></li>`).join("")}</ul>
      </div>`;
    }).join("");
  }


  // ---------- Campanhas e conjuntos ----------
  const GOAL = (reports.find(r => r.targets) || {}).targets || null;
  const roasF = v => v == null ? "—" : v.toFixed(2).replace(".", ",");
  const mCell = v => v == null ? "—" : pct1(v) + (GOAL ? marginChip(v, GOAL.margin) : "");
  const baseName = a => a.name.split(/_?OPT_\d/i)[0];
  const lastEntry = id => entries.filter(e => e.adset.id === id).sort((a, b) => (b.date - a.date) || (b.mins - a.mins))[0];
  const groups = new Map();
  ADSETS.forEach(a => { if (!groups.has(a.campaignId)) groups.set(a.campaignId, { id: a.campaignId, name: a.campaign, list: [] }); groups.get(a.campaignId).list.push(a); });
  const camps = [...groups.values()].map(g => ({ ...g, a: aggBy(g.list) })).sort((x, y) => y.a.spend - x.a.spend);
  const all = SOT;
  const repCsv = reports.find(r => r.fromCsv);
  const repTotal = repCsv ? sum(repCsv.rows.map(x => x[1])) : null;

  document.getElementById("camp-count").textContent = camps.length;
  document.getElementById("camp-tiles").innerHTML = [
    ["Valor gasto", usd.format(all.spend), "soma dos conjuntos · fonte da verdade"],
    ["Campanhas", String(camps.length), ""],
    ["Conjuntos de anúncios", String(ADSETS.length), ""],
    ["ROAS site", roasF(all.roasWeb), "offline: " + roasF(all.roasOff) + " · ponderado pelo gasto"]
  ].map(t => `<div class="tile"><span class="k">${t[0]}</span><span class="v">${t[1]}</span>${t[2] ? `<span class="n">${t[2]}</span>` : ""}</div>`).join("");
  document.getElementById("camp-src").textContent = ADSETS_SOURCE.label + " · " + fmt.format(parse(ADSETS_SOURCE.since)) + " a " + fmt.format(parse(ADSETS_SOURCE.until));

  const campRow = (label, a, title, cls) => {
    const share = all.spend ? a.spend / all.spend : 0;
    return `<tr class="${cls || ""}"><td title="${esc(title || "")}">${esc(label)}</td><td>${a.n}</td><td>${usd.format(a.spend)}</td>` +
      `<td><span class="share"><span class="bar"><i style="width:${(share * 100).toFixed(1)}%"></i></span>${dec1(share * 100)}%</span></td>` +
      `<td>${roasF(a.roasWeb)}</td><td>${roasF(a.roasOff)}</td><td>${mCell(a.m1)}</td><td>${mCell(a.m2)}</td></tr>`;
  };
  document.getElementById("camp-table").innerHTML =
    `<thead><tr><th>Campanha</th><th>Conjuntos</th><th>Valor gasto (USD)</th><th>% do gasto</th><th>ROAS site</th><th>ROAS offline</th><th>Margin %</th><th>Margin % 2</th></tr></thead><tbody>` +
    campRow("Todas as campanhas", all, "", "total") + camps.map(c => campRow(campShort(c.name), c.a, c.name)).join("") + `</tbody>`;
  document.getElementById("camp-note").textContent =
    "ROAS e Margin % por campanha são médias ponderadas pelo gasto dos conjuntos. A base da Margin % não foi informada, então a margin agregada é uma aproximação." +
    (repTotal != null ? " Os dados diários do Relatório 1 somam " + usd.format(repTotal) + " (diferença de " + usd.format(Math.abs(all.spend - repTotal)) + ")." : "");

  const sel = document.getElementById("f-camp");
  sel.innerHTML = `<option value="all">Todas as campanhas (${ADSETS.length})</option>` + camps.map(c => `<option value="${esc(c.id)}">${esc(campShort(c.name))} (${c.a.n})</option>`).join("");
  const cols = [["name", "Conjunto"], ["camp", "Campanha"], ["spend", "Valor gasto (USD)"], ["roasWeb", "ROAS site"], ["roasOff", "ROAS offline"], ["m1", "Margin %"], ["m2", "Margin % 2"], ["bid", "Lance"], ["budget", "Orçamento/dia"], [null, "Última otimização"]];
  const adState = { camp: "all", key: "spend", dir: -1 };
  const adVal = (a, k) => k === "name" ? baseName(a) : k === "camp" ? campShort(a.campaign) : a[k];
  function renderAdsets() {
    const list = ADSETS.filter(a => adState.camp === "all" || a.campaignId === adState.camp).sort((x, y) => {
      const a = adVal(x, adState.key), b = adVal(y, adState.key);
      if (a == null && b == null) return 0;
      if (a == null) return 1;
      if (b == null) return -1;
      return (typeof a === "string" ? a.localeCompare(b) : a - b) * adState.dir;
    });
    document.getElementById("ad-thead").innerHTML = "<tr>" + cols.map(([k, l]) => k
      ? `<th aria-sort="${adState.key === k ? (adState.dir > 0 ? "ascending" : "descending") : "none"}"><button class="sort" data-k="${k}">${l}<span aria-hidden="true">${adState.key === k ? (adState.dir > 0 ? " ▲" : " ▼") : ""}</span></button></th>`
      : `<th>${l}</th>`).join("") + "</tr>";
    document.getElementById("ad-tbody").innerHTML = list.map(a => {
      const e = lastEntry(a.id);
      const opt = e ? String(e.date.getDate()).padStart(2, "0") + "/" + String(e.date.getMonth() + 1).padStart(2, "0") + " " + timeLabel(e) + " " + actionChip(e) : "—";
      return `<tr><td>${esc(baseName(a))}</td><td title="${esc(a.campaign)}">${esc(campShort(a.campaign))}</td><td>${usd.format(a.spend)}</td><td>${roasF(a.roasWeb)}</td><td>${roasF(a.roasOff)}</td><td>${mCell(a.m1)}</td><td>${mCell(a.m2)}</td><td>${esc(a.bid)}</td><td>${num2.format(a.budget)}</td><td>${opt}</td></tr>`;
    }).join("");
    document.getElementById("ad-count").textContent = list.length + (list.length === 1 ? " conjunto" : " conjuntos");
  }
  sel.addEventListener("change", () => { adState.camp = sel.value; renderAdsets(); });
  document.getElementById("ad-thead").addEventListener("click", e => {
    const b = e.target.closest(".sort");
    if (!b) return;
    const k = b.dataset.k;
    if (adState.key === k) adState.dir *= -1; else { adState.key = k; adState.dir = (k === "name" || k === "camp") ? 1 : -1; }
    renderAdsets();
  });
  renderAdsets();

  let startTab = "rel";
  try { const s = localStorage.getItem("ib-tab"); if (s && tabs[s]) startTab = s; } catch (e) {}
  if (startTab !== "rel") showTab(startTab);
</script>
